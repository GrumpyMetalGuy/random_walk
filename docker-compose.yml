services:
  app:
    # Build the image locally from the Dockerfile in this repo. There is no
    # published pre-built image available — set the `image:` field too if you
    # want to tag the locally-built image for re-use.
    build: .
    image: random-walk:latest
    ports:
      - "4000:4000"
    volumes:
      - random-walk_data:/app/data
    environment:
      - JWT_SECRET=change-me-please # generate with: openssl rand -base64 64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  random-walk_data: 